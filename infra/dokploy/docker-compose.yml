# ===========================================================================
# bot-plataform — compose para Dokploy.
# Despliega backend (Hono) + frontend (nginx) en la red compartida
# 'dokploy-network' para alcanzar el Postgres "labs" y el Redis compartidos,
# y hablar con Evolution API / Chatwoot (vía sus dominios públicos).
#
# Build context = raíz del repo (../../ respecto a este archivo).
# Dokploy enruta los dominios a los servicios vía Traefik (ver dokploy.json).
# ===========================================================================

services:
  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Ambiente lógico: prefija las instancias Evolution (prod-bot-<id>) en la
      # infra compartida. Sin esto el backend tomaría el default "dev".
      DEPLOY_ENV: ${DEPLOY_ENV:-prod}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      SUPERADMIN_USER_IDS: ${SUPERADMIN_USER_IDS}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN}
      PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_BASE_URL}
      CHATWOOT_API_URL: ${CHATWOOT_API_URL}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN}
      CHATWOOT_PLATFORM_TOKEN: ${CHATWOOT_PLATFORM_TOKEN}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID}
      CHATWOOT_ADMIN_USER_ID: ${CHATWOOT_ADMIN_USER_ID}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      # IA (E05/E06/E07)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-12000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dokploy-network

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
