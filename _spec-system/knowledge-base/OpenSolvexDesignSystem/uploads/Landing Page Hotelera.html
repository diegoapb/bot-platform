<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tu Solvex · Hotelería &amp; Turismo — Más reservas directas, menos fricción</title>
  <meta name="description" content="Implementamos herramientas open-source para que tu hotel capte más huéspedes, reduzca comisiones y opere mejor. Casos reales, stack abierto." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="hospitality.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="neural-network.jsx"></script>
  <script type="text/babel" src="hospitality.jsx"></script>

  <script type="text/babel" data-presets="react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "dark": true,
      "heroVariant": "growth"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      React.useEffect(() => {
        document.body.classList.toggle('light-mode', !t.dark);
      }, [t.dark]);
      return (
        <React.Fragment>
          <HotNav />
          <HotHero />
          <HotPillars />
          <HotStack />
          <HotResults />
          <HotCases />
          <HotSolutions />
          <HotCTA />
          <HotFooter />
          <TweaksPanel>
            <TweakSection label="Tema" />
            <TweakToggle label="Modo oscuro" value={t.dark} onChange={(v) => setTweak('dark', v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    function mount() {
      if (typeof HotNav === 'undefined' || typeof TweaksPanel === 'undefined' || typeof NeuralNetwork === 'undefined' || typeof Ico === 'undefined') {
        return setTimeout(mount, 50);
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
    mount();
  </script>
</body>
</html>
