<!doctype html>
<!-- @dsCard group="Brand" name="Spacing · Elevation" subtitle="Shadow & lime glow tokens" viewport="760x240" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="pad" style="background:#ECE6D7;">
  <div class="lbl" style="margin-bottom:18px;">Elevation · shadows used only on hover · resting cards rely on borders</div>
  <div class="row" style="gap:18px">
    <div style="flex:1; min-width:160px; background:#FFFDF7; border:1px solid rgba(31,41,55,0.10); border-radius:14px; padding:16px; min-height:96px;">
      <div class="lbl">resting</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:#6B7280; margin-top:18px;">1px border<br>no shadow</div>
    </div>
    <div style="flex:1; min-width:160px; background:#FFFDF7; border:1px solid rgba(31,41,55,0.22); border-radius:14px; padding:16px; min-height:96px; box-shadow:0 18px 40px -28px rgba(31,41,55,0.25); transform:translateY(-2px);">
      <div class="lbl">hover · soft</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:#6B7280; margin-top:18px;">0 18px 40px -28px<br>rgba(31,41,55,.25)</div>
    </div>
    <div style="flex:1; min-width:160px; background:#FFFDF7; border:1px solid #00FF88; border-radius:14px; padding:16px; min-height:96px; box-shadow:0 0 0 1px #00FF88, 0 18px 40px -28px rgba(0,255,136,0.4); transform:translateY(-2px);">
      <div class="lbl lime">hover · lime</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:#6B7280; margin-top:18px;">ring + glow<br>feature/bento cards</div>
    </div>
    <div style="flex:1; min-width:160px; background:#00FF88; color:#0D2818; border-radius:999px; padding:14px 22px; min-height:96px; box-shadow:0 0 0 6px rgba(0,255,136,0.18), 0 12px 30px -12px rgba(0,255,136,0.55); display:flex; flex-direction:column; justify-content:space-between;">
      <div class="lbl" style="color:#0D2818;">primary CTA · glow</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:#0D2818;">ring + drop · the only saturated shadow</div>
    </div>
  </div>
</body></html>
